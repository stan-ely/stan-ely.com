<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
     aria-label="Beam, at fifty percent frame loss. Numbered chunks on a loop cost 11.2 times N frames, struck out; a fountain code costs 2.79 times N, averaged over 20 seeds. Frames the sender must emit, over 1,748 blocks of a 1 MiB payload.">
  <!-- Source for featured.webp. Rebuild with: node scripts/make-cards.js
       Both figures are 20-seed means from scripts/beam-loss-bench.mjs; see the post's table. -->
  <rect width="1200" height="630" fill="#FDFBF7"/>
  <rect x="600" y="0" width="600" height="630" fill="#F59E0B"/>

  <text x="72" y="88" font-family="Inter Variable, sans-serif" font-size="20"
        font-weight="700" letter-spacing="3.2" fill="#8C3C00">BEAM · AT 50% FRAME LOSS</text>

  <text x="72" y="332" font-family="Inter Variable, sans-serif" font-size="184"
        font-weight="800" fill="#CFCBC4" letter-spacing="-6">11.2×</text>
  <line x1="58" y1="278" x2="470" y2="278" stroke="#8A8784" stroke-width="10" stroke-linecap="round"/>
  <text x="74" y="392" font-family="Inter Variable, sans-serif" font-size="25"
        font-weight="500" fill="#6F6C69">numbered chunks on a loop</text>

  <text x="672" y="332" font-family="Inter Variable, sans-serif" font-size="184"
        font-weight="800" fill="#141210" letter-spacing="-6">2.79×</text>
  <text x="674" y="392" font-family="Inter Variable, sans-serif" font-size="25"
        font-weight="600" fill="#5C3200">a fountain code</text>

  <text x="72" y="516" font-family="Fraunces Variable, Georgia, serif" font-size="55"
        font-weight="600" fill="#242220">Sending a file</text>
  <text x="72" y="578" font-family="Fraunces Variable, Georgia, serif" font-size="55"
        font-weight="600" fill="#242220">with light</text>

  <text x="674" y="548" font-family="Inter Variable, sans-serif" font-size="22"
        font-weight="500" fill="#5C3200">frames the sender must emit,</text>
  <text x="674" y="580" font-family="Inter Variable, sans-serif" font-size="22"
        font-weight="500" fill="#5C3200">over 1,748 blocks · stan-ely.com</text>
</svg>
