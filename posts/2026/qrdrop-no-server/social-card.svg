<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
     aria-label="Two devices facing each other with a heavy amber link running between them. Where a server would sit, the link is empty and marked with a crossed-out circle labelled no server. Below: What no server forces you to build.">
  <!-- Source for featured.webp. Rebuild with: node scripts/make-cards.js
       The idea is the original card's: two devices, a direct link, and a
       conspicuous nothing where the middle would be. Rebuilt at poster scale
       on a light ground so it survives a feed thumbnail. -->
  <defs>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A00"/>
      <stop offset="1" stop-color="#FFC24D"/>
    </linearGradient>
    <linearGradient id="wire2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC24D"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#FDFBF7"/>

  <text x="72" y="82" font-family="Inter Variable, sans-serif" font-size="19"
        font-weight="700" letter-spacing="3.6" fill="#8C3C00">QRDROP</text>

  <!-- left device -->
  <rect x="96" y="140" width="150" height="240" rx="22" fill="#1A1816"/>
  <rect x="112" y="156" width="118" height="208" rx="12" fill="#F59E0B"/>
  <!-- right device -->
  <rect x="954" y="140" width="150" height="240" rx="22" fill="#1A1816"/>
  <rect x="970" y="156" width="118" height="208" rx="12" fill="#F59E0B"/>

  <!-- the link, broken where a server would be -->
  <rect x="246" y="252" width="248" height="16" rx="8" fill="url(#wire)"/>
  <rect x="706" y="252" width="248" height="16" rx="8" fill="url(#wire2)"/>

  <circle cx="600" cy="260" r="70" fill="#FDFBF7" stroke="#D6D2CB" stroke-width="7"/>
  <line x1="551" y1="309" x2="649" y2="211" stroke="#D6D2CB" stroke-width="7" stroke-linecap="round"/>

  <text x="600" y="392" text-anchor="middle" font-family="Inter Variable, sans-serif"
        font-size="21" font-weight="700" letter-spacing="2.6" fill="#8A8784">NO SERVER</text>

  <rect x="0" y="446" width="1200" height="184" fill="#1A1816"/>
  <text x="72" y="528" font-family="Fraunces Variable, Georgia, serif" font-size="57"
        font-weight="600" fill="#FDFBF7">What “no server” forces you to build</text>
  <text x="72" y="576" font-family="Inter Variable, sans-serif" font-size="23"
        font-weight="400" fill="#B5B2AF">A QR carries the key · nothing in between holds a readable copy</text>
</svg>
